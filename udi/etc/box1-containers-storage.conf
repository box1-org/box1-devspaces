# Rootless podman storage for Box1 Dev Spaces workspaces (box1-org/box1-docs#114).
# Kept outside /home/user: the persistent home is a subPath of the per-user PVC, and
# volumes mounted inside it left nested mounts the kubelet could not tear down, which
# blocked workspace deletion and the per-user PVC. Devfiles mount an ephemeral
# volume at /var/lib/box1-containers; without it, storage lands in the image layer.
[storage]
driver = "overlay"
graphroot = "/var/lib/box1-containers/storage"
runroot = "/tmp/podman-run/storage"
